name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Build and deploy
        run: |
          set -euo pipefail
          cd "${{ secrets.DEPLOY_PATH }}"
          bash deploy.sh
